services:
  nginx:
    image: nginx:latest
    ports:
      - 5016:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web
      - adonis_app
    networks:
      - default
  web:
    build:
      context: ../nextjs-starter-kit-main
      cache_from:
        - web:latest
    environment:
      NEXT_PUBLIC_API_URL: http://adonis_app:3333
  adonis_app:
    build:
      context: .
      cache_from:
        - adonis_app:latest
    env_file:
      - .env
    environment:
      NODE_OPTIONS: '--inspect=0.0.0.0'
      BACKEND_URL: http://adonis_app:3333
      FRONTEND_URL: http://web:3000

